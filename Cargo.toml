[workspace]
resolver = "3"
members = ["crates/tokenscope-model", "crates/tokenscope-executor", "crates/tokenscope-adapter", "crates/tokenscope-invariants", "crates/tokenscope-scenarios", "crates/tokenscope-core", "crates/tokenscope-shrinker", "crates/tokenscope-report", "crates/tokenscope-cli", "crates/tokenscope-tui", "crates/tokenscope-fuzz-harness"]
# The on-chain demo programs are built for SBF with `cargo build-sbf` and keep their own lockfile.
exclude = ["programs/demo-escrow", "programs/demo-forwarder", "programs/demo-hook", "fuzz", "demo/escrow-anchor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/integral-830/tokenscope"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep host builds small: the Agave dependency tree is large and disk is limited.
[profile.dev]
debug = false

[profile.test]
debug = false
