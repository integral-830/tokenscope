[package]
name = "tokenscope-executor"
description = "Real SVM execution of Token-2022 setup and target programs (Mollusk-based)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
log = "0.4"
mollusk-svm = "=0.16.2"
mollusk-svm-programs-token-2022 = { version = "=0.16.2", features = ["extensions"] }
# Only the bundled SPL Associated Token Account program ELF is used (generic SBF targets).
mollusk-svm-programs-token = { version = "=0.16.2", default-features = false, features = ["associated-token"] }
solana-account = "4.3"
solana-instruction = "3.2"
solana-program-pack = "3.1"
solana-pubkey = { version = "4.1", features = ["curve25519"] }
solana-svm-log-collector = "4.3"
solana-system-interface = { version = "3.3", features = ["bincode"] }
spl-token-2022-interface = "=3.1.2"
sha2.workspace = true
thiserror.workspace = true
tokenscope-model = { path = "../tokenscope-model" }

[dev-dependencies]
mollusk-svm-programs-memo = "=0.16.2"

[lints]
workspace = true
